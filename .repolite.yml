prog_name: repolite
top_dir: ext  # local directory path for enabled repositories
pull_with_rebase: false  # use --ff-only if false
# add new repo_name sections as needed
repos:
  - repo_name: openscap
    repo_alias: oscap
    repo_url: git@github.com:VCTLabs/openscap.git
    repo_depth: 0
    repo_remote: origin
    repo_opts: []
    repo_branch: workbench-1.3
    repo_hash: 23f2b07dfc22deb4e4c9cbe99ae025f9e28aeab4  # 1.3.14+
    repo_use_rebase: true
    repo_has_lfs_files: false
    repo_init_submodules: false
    repo_install: false
    repo_enable: true
  - repo_name: scap-security-guide
    repo_alias: content
    repo_url: git@github.com:VCTLabs/scap-security-guide.git
    repo_depth: 0
    repo_remote: origin
    repo_opts: []
    repo_branch: oe-stable
    repo_hash: 40b67e50f322c1539cc4ed759b86b4a6b31873d0  # v0.1.80+
    repo_use_rebase: true
    repo_has_lfs_files: false
    repo_init_submodules: false
    repo_install: false
    repo_enable: true
  - repo_name: pyserv
    repo_alias: null
    repo_url: https://github.com/sarnold/pyserv.git
    repo_depth: 0
    repo_remote: origin
    repo_opts: []
    repo_branch: master
    repo_hash: 1.9.1
    repo_use_rebase: false
    repo_has_lfs_files: false
    repo_init_submodules: false
    repo_install: false
    repo_enable: false
  - repo_name: yaml-tools
    repo_alias: null
    repo_url: https://github.com/sarnold/yaml-tools.git
    repo_depth: 0
    repo_remote: origin
    repo_opts: []
    repo_branch: main
    repo_hash: 0.5.2
    repo_use_rebase: false
    repo_has_lfs_files: false
    repo_init_submodules: false
    repo_install: false
    repo_enable: true
