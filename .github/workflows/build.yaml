name: Gating
on:
  push:
    branches: [ main, v1-2 ]
  pull_request:
    branches: [ '*' ]

jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: vegardit/fast-apt-mirror.sh@v1
        with:
          exclude-current: true  # Don't include the current APT mirror since it is unreliable.

      - name: Install Deps
        uses: mstksg/get-package@v1
        with:
          apt-get: build-essential openssh-client libqt5xmlpatterns5-dev ssh-askpass asciidoc libpolkit-agent-1-0

      - name:  Install openscap 1.3 from PPA
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y -qq update
          sudo apt-get install -yqq software-properties-common
          sudo add-apt-repository ppa:nerdboy/embedded
          sudo apt-get -qq update
          sudo apt-get install -y libopenscap-dev

      - name: Build
        run: |
          mkdir -p build
          pushd build
          cmake ..
          make -j4
          popd

  build-fedora:
    name: Build on Fedora Latest (Container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Deps
        run: |
          dnf install -y git cmake gcc-c++ openssh-clients util-linux qt5-qtbase-devel qt5-qtxmlpatterns-devel openssh-askpass asciidoc polkit-libs
          dnf install -y procps-ng dbus-devel libacl-devel libblkid-devel libcap-devel libcurl-devel libgcrypt-devel libselinux-devel libxml2-devel libxslt-devel libattr-devel make openldap-devel pcre-devel perl-XML-Parser perl-XML-XPath perl-devel python3-devel python3-dbusmock rpm-devel swig bzip2-devel gcc-c++ libyaml-devel xmlsec1-devel xmlsec1-openssl-devel hostname bzip2 lua rpm-build which strace python3-pytest

      - name: Checkout openscap
        uses: actions/checkout@v6
        with:
          repository: VCTLabs/openscap
          path: openscap
          ref: devel-1.3
          submodules: recursive

      - name: Build OpenSCAP
        run: |
          pushd openscap/build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo ../
          make -j4
          sudo make install
          popd

      - name: Build
        run: |
          mkdir -p build
          pushd build
          cmake ..
          make -j4
          popd

  build-macos:
    name: Build on MacOS X Latest
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Checkout openscap
      uses: actions/checkout@v6
      with:
        repository: VCTLabs/openscap
        path: openscap
        ref: devel-1.3
        submodules: recursive

    - name: Checkout scap-security-guide
      uses: actions/checkout@v6
      with:
        repository: VCTLabs/scap-security-guide
        path: scap-security-guide
        ref: oe-stable
        fetch-depth: 0

    - name: Install Deps
      run: |
        brew install qt5
        brew install asciidoc
        brew install doxygen
        brew install opendbx
        brew install popt
        brew install swig
        brew install upx
        brew install libxmlsec1
        brew install pcre
        npm install -g appdmg
        echo "Qt5_DIR=/opt/homebrew/opt/qt@5/lib/cmake/Qt5" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/opt/homebrew/opt/qt@5/lib/pkgconfig" >> $GITHUB_ENV

    - name: Build OpenSCAP
      run: |
        pushd openscap/build
        cmake -DENABLE_PROBES=FALSE ../
        make -j4
        sudo make install
        popd

    - name: Build OSX Image
      run: |
        REPOSITORY="ComplianceAsCode/content"
        chmod +x ./build-for-osx.sh
        ./build-for-osx.sh
        pushd scap-security-guide
        REL_TAG=`git tag --sort="version:refname"  | tail -n2 | head -n1`
        REL_TAG_NUM=`echo ${REL_TAG} | cut -d"v" -f2`
        popd
        echo "SSG version: ${REL_TAG_NUM}"
        DWN_LINK="https://github.com/${REPOSITORY}/releases/download/${REL_TAG}/scap-security-guide-${REL_TAG_NUM}.zip"
        if [ -z "${DWN_LINK}" ]; then echo 'Could not get the ZIP URL! It is empty!'; exit 1; fi
        wget "${DWN_LINK}" -O ssg.zip
        mkdir -p `pwd`/build-osx/scap-workbench.app/Contents/Resources/ssg/ && unzip ssg.zip && cp -a scap-security-guide-*/* `pwd`/build-osx/scap-workbench.app/Contents/Resources/ssg/
        cd build-osx && bash osx-create-dmg.sh

    - name: Upload OSX Image
      uses: actions/upload-artifact@v7
      with:
        name: scap-workbench-1.2.1.dmg
        path: build-osx/scap-workbench-1.2.1.dmg

